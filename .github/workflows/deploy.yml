name: Deploy to cPanel (Node.js Next.js)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Next.js project on GitHub Cloud
        run: npm run build

      - name: 5. Prepare production release package
        run: |
          mkdir release
          cp -r .next release/
          cp -r public release/ 2>/dev/null || true
          cp server.js release/ 2>/dev/null || true
          cp app.js release/ 2>/dev/null || true
          cp package.json release/
          cp .htaccess release/ 2>/dev/null || true

      - name: 6. Deploy only changed files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DESTINATION_FOLDER || 'nodetest.newleafskills.com/' }}
          local-dir: release/
          dangerous-clean-slate: false
